name: Publish SDK release (draft)

# Creates a DRAFT release "PDFix SDK <version>" from a finished Bitbucket build on dl.pdfix.net.
# Never modifies an existing release or tag - see scripts/publish-release.sh.
# Publishing the draft is a manual step in the GitHub UI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version, e.g. 10.0.0 (same as pdfix/version.txt)"
        required: true
        type: string
      branch:
        description: "Full pdfix branch name of the build, e.g. release/v10.0.0"
        required: true
        type: string
      commit:
        description: "Full 40-char pdfix commit of the build"
        required: true
        type: string
      dry_run:
        description: "Only download and package, create nothing on GitHub"
        required: true
        default: true
        type: boolean

permissions:
  contents: write # create the draft release

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (main, for changelog.md and the script)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          WORK_DIR: ${{ runner.temp }}/release
        shell: bash
        run: |
          args=("$VERSION" "$BRANCH" "$COMMIT")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          # Keep the script's exit code (a plain `| tee` would hide a failure), but always write the summary.
          set +e
          ./scripts/publish-release.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status="${PIPESTATUS[0]}"
          {
            echo "## Release v${VERSION} (dry run: ${DRY_RUN}) - exit code ${status}"
            echo '```'
            cat "$RUNNER_TEMP/publish.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
